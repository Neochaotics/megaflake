<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fabd2f;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#fabd2f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fabd2f;stop-opacity:0" />
    </radialGradient>
    
    <!-- Tree silhouette filter -->
    <filter id="treeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Pure gruvbox dark background -->
  <rect width="3840" height="2160" fill="#1d2021"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#3c3836" stroke-width="1" opacity="0.1">
    <line x1="0" y1="540" x2="3840" y2="540"/>
    <line x1="0" y1="1080" x2="3840" y2="1080"/>
    <line x1="0" y1="1620" x2="3840" y2="1620"/>
    <line x1="960" y1="0" x2="960" y2="2160"/>
    <line x1="1920" y1="0" x2="1920" y2="2160"/>
    <line x1="2880" y1="0" x2="2880" y2="2160"/>
  </g>
  
  <!-- Moon -->
  <circle cx="2800" cy="350" r="180" fill="url(#moonGlow)"/>
  <circle cx="2800" cy="350" r="60" fill="#fabd2f"/>
  
  <!-- Stars -->
  <g fill="#d5c4a1" opacity="0.6">
    <circle cx="400" cy="150" r="1.5"/>
    <circle cx="700" cy="200" r="1"/>
    <circle cx="1100" cy="120" r="1.2"/>
    <circle cx="1500" cy="250" r="1"/>
    <circle cx="1900" cy="100" r="1.5"/>
    <circle cx="2300" cy="180" r="1"/>
    <circle cx="3300" cy="220" r="1.2"/>
    <circle cx="3600" cy="150" r="1"/>
    <circle cx="500" cy="350" r="0.8"/>
    <circle cx="1700" cy="320" r="0.9"/>
    <circle cx="2500" cy="280" r="1"/>
    <circle cx="3100" cy="350" r="0.8"/>
  </g>
  
  <!-- Birds (simple V shapes) -->
  <g stroke="#ebdbb2" stroke-width="2" fill="none" opacity="0.5">
    <!-- Bird 1 -->
    <path d="M800,300 Q810,290 820,300 Q830,290 840,300"/>
    <!-- Bird 2 -->
    <path d="M950,250 Q958,242 966,250 Q974,242 982,250"/>
    <!-- Bird 3 -->
    <path d="M1200,350 Q1210,340 1220,350 Q1230,340 1240,350"/>
    <!-- Bird 4 -->
    <path d="M2000,280 Q2010,270 2020,280 Q2030,270 2040,280"/>
    <!-- Bird 5 -->
    <path d="M2600,320 Q2608,312 2616,320 Q2624,312 2632,320"/>
  </g>
  
  <!-- Distant hills -->
  <path d="M0,900 Q400,850 800,880 Q1200,910 1600,860 Q2000,810 2400,850 Q2800,890 3200,840 Q3600,790 3840,820 L3840,2160 L0,2160 Z" 
        fill="#282828"/>
  
  <path d="M0,1100 Q300,1020 600,1050 Q900,1080 1200,1030 Q1500,980 1800,1020 Q2100,1060 2400,1010 Q2700,960 3000,1000 Q3300,1040 3600,990 Q3800,970 3840,990 L3840,2160 L0,2160 Z" 
        fill="#32302f"/>
  
  <path d="M0,1350 Q400,1280 800,1310 Q1200,1340 1600,1290 Q2000,1240 2400,1280 Q2800,1320 3200,1270 Q3600,1220 3840,1260 L3840,2160 L0,2160 Z" 
        fill="#3c3836"/>
  
  <path d="M0,1600 Q350,1520 700,1550 Q1050,1580 1400,1530 Q1750,1480 2100,1520 Q2450,1560 2800,1510 Q3150,1460 3500,1500 Q3750,1540 3840,1510 L3840,2160 L0,2160 Z" 
        fill="#45403d"/>
  
  <!-- Bare trees (silhouettes) -->
  <g fill="#1d2021" filter="url(#treeGlow)">
    <!-- Tree 1 - left -->
    <path d="M200,1700 L200,1400 M200,1500 L150,1450 M200,1500 L170,1420 M200,1500 L230,1420 M200,1400 L180,1350 M200,1400 L200,1330 M200,1400 L220,1350"/>
    <path d="M180,1350 L160,1300 M180,1350 L200,1280 M180,1350 L200,1300"/>
    <path d="M200,1330 L185,1260 M200,1330 L200,1250 M200,1330 L215,1260"/>
    
    <!-- Tree 2 - left mid -->
    <path d="M500,1750 L500,1500 M500,1580 L460,1540 M500,1580 L480,1480 M500,1580 L520,1480 M500,1500 L470,1460 M500,1500 L500,1400 M500,1500 L530,1460"/>
    <path d="M470,1460 L450,1420 M470,1460 L490,1380 M470,1460 L490,1420"/>
    <path d="M500,1400 L480,1340 M500,1400 L500,1320 M500,1400 L520,1340"/>
    
    <!-- Tree 3 - center left -->
    <path d="M900,1800 L900,1550 M900,1620 L860,1580 M900,1620 L840,1520 M900,1620 L960,1520 M900,1550 L870,1500 M900,1550 L900,1450 M900,1550 L930,1500"/>
    <path d="M870,1500 L840,1450 M870,1500 L900,1400 M870,1500 L900,1450"/>
    <path d="M900,1450 L870,1380 M900,1450 L900,1350 M900,1450 L930,1380"/>
    
    <!-- Tree 4 - center right -->
    <path d="M1500,1780 L1500,1530 M1500,1600 L1460,1560 M1500,1600 L1440,1500 M1500,1600 L1560,1500 M1500,1530 L1470,1480 M1500,1530 L1500,1430 M1500,1530 L1530,1480"/>
    <path d="M1470,1480 L1440,1430 M1470,1480 L1500,1380 M1470,1480 L1500,1430"/>
    <path d="M1500,1430 L1470,1360 M1500,1430 L1500,1330 M1500,1430 L1530,1360"/>
    
    <!-- Tree 5 - right side -->
    <path d="M2200,1750 L2200,1520 M2200,1590 L2160,1550 M2200,1590 L2140,1490 M2200,1590 L2260,1490 M2200,1520 L2170,1470 M2200,1520 L2200,1420 M2200,1520 L2230,1470"/>
    <path d="M2170,1470 L2140,1420 M2170,1470 L2200,1350 M2170,1470 L2200,1420"/>
    <path d="M2200,1420 L2170,1350 M2200,1420 L2200,1300 M2200,1420 L2230,1350"/>
    
    <!-- Tree 6 - far right -->
    <path d="M3000,1700 L3000,1450 M3000,1520 L2960,1480 M3000,1520 L2940,1420 M3000,1520 L3060,1420 M3000,1450 L2970,1400 M3000,1450 L3000,1350 M3000,1450 L3030,1400"/>
    <path d="M2970,1400 L2940,1350 M2970,1400 L3000,1300 M2970,1400 L3000,1350"/>
    <path d="M3000,1350 L2970,1280 M3000,1350 L3000,1230 M3000,1350 L3030,1280"/>
    
    <!-- Tree 7 - right edge -->
    <path d="M3600,1680 L3600,1430 M3600,1500 L3560,1460 M3600,1500 L3540,1400 M3600,1500 L3660,1400 M3600,1430 L3570,1380 M3600,1430 L3600,1280 M3600,1430 L3630,1380"/>
    
    <!-- Small sapling 1 -->
    <path d="M350,1850 L350,1750 M350,1780 L330,1750 M350,1780 L370,1750"/>
    
    <!-- Small sapling 2 -->
    <path d="M1800,1900 L1800,1820 M1800,1840 L1785,1820 M1800,1840 L1815,1820"/>
    
    <!-- Small sapling 3 -->
    <path d="M2700,1880 L2700,1800 M2700,1820 L2685,1800 M2700,1820 L2715,1800"/>
  </g>
  
  <!-- Foreground ground -->
  <path d="M0,1850 Q500,1800 1000,1850 Q1500,1900 2000,1850 Q2500,1800 3000,1850 Q3500,1900 3840,1850 L3840,2160 L0,2160 Z" 
        fill="#1d2021"/>
  
  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" style="stop-color:#1d2021;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#1d2021;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>